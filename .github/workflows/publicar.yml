# Publica a wiki no GitHub Pages toda vez que algo é enviado para a branch main
name: Publicar wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material==9.6.*"
      - run: mkdocs gh-deploy --force
